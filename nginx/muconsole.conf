# Nginx Virtual Host Configuration for MuConsole (Parallel Dedicated Console Host)
# Domain: console.lma1980.duckdns.org
#
# Serves MuConsole static WASM/JS/CSS/WOFF2 assets at / with dual-layer caching,
# integrates oauth2-proxy (127.0.0.1:4180) for invite-only GitHub operator
# authentication, and proxies CI/CD APIs while keeping POST /webhook strictly on
# hook.lma1980.duckdns.org.

server {
    listen 80;
    listen [::]:80;
    server_name console.lma1980.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 8080;
    listen [::]:8080;
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    quic_retry on;
    server_name console.lma1980.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Shared proxy secret authenticating X-Forwarded-User to ActionRunner-controller
    # and bearer token authenticating /api/cd/* to MuConDe-controller
    # (override via /etc/nginx/snippets/muconsole-*.conf in production).
    set $muconsole_proxy_secret "REPLACE_WITH_ACTION_RUNNER_PROXY_SECRET";
    set $muconsole_cd_token "REPLACE_WITH_MUCONDE_CD_API_TOKEN";

    # HTTP Security & Ingress Headers (HTTP/3 Alt-Svc advertisement)
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; worker-src 'self'; font-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self';" always;

    root /var/www/muconsole;
    index index.html;

    # 1. Webhook Ingress is strictly restricted to hook.lma1980.duckdns.org
    location = /webhook {
        return 404;
    }
    location ^~ /webhook/ {
        return 404;
    }

    # 2. oauth2-proxy OAuth2 Handshake & Internal auth_request Subrequest
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/callback {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 400 403 500 502 503 504 =400 @oauth2_callback_err;
    }

    location @oauth2_callback_err {
        default_type text/plain;
        return 400 "Bad Request: invalid or missing OAuth2 callback parameters\n";
    }

    location = /oauth2/sign_out {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; worker-src 'self'; font-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self';" always;
        add_header Set-Cookie "_muconsole_oauth2=; Path=/; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; Secure; SameSite=Lax" always;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }


    # 3. Strict Operator-Only Routes (Raw Job Logs, Job Restart/Retry, HA, Invite Management)
    location ~ ^/(?:api/)?jobs/[^/]+/(?:log|logs|restart|resume|retry)$ {
        auth_request /oauth2/auth;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;

        proxy_pass http://192.0.2.10:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $auth_user;
        proxy_set_header X-Proxy-Secret $muconsole_proxy_secret;
        proxy_set_header Connection "";
        proxy_read_timeout 86400s;
    }

    # 3b. Read-only Artifact Registry (MuRegist) API (Packages, Canaries/Taints, CAS Health)
    location ^~ /api/reg/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:8443/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ^~ /api/v1/registry/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:8443/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 3c. Read-only Observability (MuObserve) API (Smartscape, Problems, PurePath Traces, OTLP Logs, Metrics, Store)
    location ^~ /api/obs/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:9480/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ^~ /api/observe/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:9480/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ~ ^/(?:api/)?ha/(?:promote|demote)$ {
        auth_request /oauth2/auth;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;

        proxy_pass http://192.0.2.10:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $auth_user;
        proxy_set_header X-Proxy-Secret $muconsole_proxy_secret;
    }

    location = /api/auth/redeem {
        auth_request /oauth2/auth;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;

        proxy_pass http://192.0.2.10:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $auth_user;
        proxy_set_header X-Proxy-Secret $muconsole_proxy_secret;
    }

    location ^~ /api/auth/invites {
        auth_request /oauth2/auth;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;

        proxy_pass http://192.0.2.10:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $auth_user;
        proxy_set_header X-Proxy-Secret $muconsole_proxy_secret;
    }

    location ^~ /api/auth/users/ {
        auth_request /oauth2/auth;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;

        proxy_pass http://192.0.2.10:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $auth_user;
        proxy_set_header X-Proxy-Secret $muconsole_proxy_secret;
    }

    # 4. Read-only Continuous Delivery (MuConDe-controller) API & SSE Gate Progress
    # Passive session forwarding: anonymous requests fall back to @cd_anon while
    # authenticated sessions forward X-Forwarded-User and X-Proxy-Secret.
    location ^~ /api/cd/ {
        auth_request /oauth2/auth;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        error_page 401 = @cd_anon;

        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $auth_user;
        proxy_set_header X-Proxy-Secret $muconsole_proxy_secret;
        proxy_set_header Authorization "Bearer $muconsole_cd_token";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    location @cd_anon {
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User "";
        proxy_set_header Authorization "Bearer $muconsole_cd_token";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # 5. Continuous Integration (ActionRunner-controller) Public-Capable REST API,
    #    Session Probe (/api/auth/session), Queue & SSE (/api/events)
    # Passive session forwarding: anonymous requests fall back to @ci_anon so
    # public repositories remain readable without login, while signed-in operator
    # sessions forward X-Forwarded-User and X-Proxy-Secret.
    location ~ ^/(api|queue|health|events) {
        auth_request /oauth2/auth;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        error_page 401 = @ci_anon;

        proxy_pass http://192.0.2.10:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $auth_user;
        proxy_set_header X-Proxy-Secret $muconsole_proxy_secret;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    location @ci_anon {
        proxy_pass http://192.0.2.10:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # 6. Dynamic Factory Scorecards & Status Badges
    location ~ ^/(cards|badges)/ {
        proxy_pass http://192.0.2.10:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; worker-src 'self'; font-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self';" always;
    }

    # 7. Dual-Layer Caching Layer 2: WASM binaries, Worker JS modules, CSS, and WOFF2 fonts
    # Content-hash URL busting (?v=<hash>) paired with ETag + no-cache, must-revalidate
    location ~* \.(?:wasm|js|css|d\.ts|woff2?|png|svg|ico)$ {
        etag on;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; worker-src 'self'; font-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self';" always;
        try_files $uri =404;
    }

    # 8. Dual-Layer Caching Layer 1: HTML Entry Point & Hash Router Fallback
    # Never cache index.html so browsers immediately discover updated ?v=<hash> bundles
    location / {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; worker-src 'self'; font-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self';" always;
        try_files $uri $uri/ /index.html;
    }
}
