[build]
target = "index.html"
dist = "dist"
public_url = "/"

[serve]
addresses = ["127.0.0.1"]
port = 8081

[[proxy]]
backend = "http://127.0.0.1:9480/api"
rewrite = "/api/obs"

[[proxy]]
backend = "http://127.0.0.1:8444/api/cd"
rewrite = "/api/cd"

[[proxy]]
backend = "http://127.0.0.1:8443/api"
rewrite = "/api/reg"

[[proxy]]
backend = "http://127.0.0.1:8080/api/mr/v1"
rewrite = "/api/mr/v1"

[[proxy]]
backend = "http://127.0.0.1:8000/api"
rewrite = "/api"

[[proxy]]
backend = "http://127.0.0.1:8000/cards"
rewrite = "/cards"

[[proxy]]
backend = "http://127.0.0.1:8000/badges"
rewrite = "/badges"
